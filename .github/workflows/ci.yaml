name: 🧪 CI

on:
  push:
    branches:
      - 'main'
      - '2.0.0'
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]

    name: ⚙️ Running test for PHP ${{ matrix.php }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: Check commit messages
        uses: webiny/action-conventional-commits@v1.3.0

      - name: 🧰 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: ✅ Validate composer.json and composer.lock
        run: composer validate --strict

      - name: 📥 Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: ✅ Tests
        run: vendor/bin/pest --stop-on-defect

      - name: ✅ Tests with the phasync extension
        # the binary bundled in the locked phasync release, loaded through PHP_INI_SCAN_DIR so the
        # PHP processes the tests start load it too
        # the extension needs PHP 8.3+
        if: matrix.php != '8.2'
        run: |
          mkdir -p "$RUNNER_TEMP/ini"
          echo "extension=$PWD/vendor/phasync/phasync/ext/phasync-${{ matrix.php }}-nts-x86_64-glibc.so" > "$RUNNER_TEMP/ini/phasync.ini"
          PHP_INI_SCAN_DIR=":$RUNNER_TEMP/ini" php -r 'extension_loaded("phasync") || exit(1);'
          PHP_INI_SCAN_DIR=":$RUNNER_TEMP/ini" vendor/bin/pest --stop-on-defect
